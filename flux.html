<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxograma Animado - Engenharia de Petróleo (UDESC)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background-color: #f8fafc;
            --card-color: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
            --text-muted-color: #64748b;
            --accent-color: #006633; /* Verde UDESC */
            --accent-highlight-color: #00994d;
            
            /* Cores para cada fase */
            --fase1-bg: #e6f2e6; --fase1-text: #004d26;
            --fase2-bg: #e0f2f1; --fase2-text: #004d40;
            --fase3-bg: #e3f2fd; --fase3-text: #0d47a1;
            --fase4-bg: #e8eaf6; --fase4-text: #1a237e;
            --fase5-bg: #ede7f6; --fase5-text: #311b92;
            --fase6-bg: #fce4ec; --fase6-text: #880e4f;
            --fase7-bg: #fff3e0; --fase7-text: #e65100;
            --fase8-bg: #fffde7; --fase8-text: #f57f17;
            --fase9-bg: #f9fbe7; --fase9-text: #827717;
            --fase10-bg: #e0f7fa; --fase10-text: #006064;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
        }
        .fluxograma-grid {
            display: grid;
            grid-template-columns: repeat(10, minmax(150px, 1fr));
            gap: 1.5rem;
            padding: 2rem;
            overflow-x: auto;
            align-items: start;
        }
        .fase-coluna {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
        }
        .fase-titulo {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background-color: var(--accent-color);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            text-align: center;
            width: 100%;
        }
        .disciplina-card {
            background-color: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 0.5rem;
            width: 100%;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s ease-out forwards;
            border-left-width: 4px;
        }
        .disciplina-card:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .optativa {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }
        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }
        /* Cores das Fases */
        .fase-1 .fase-titulo { background-color: var(--fase1-text); } .fase-1 .disciplina-card { border-left-color: var(--fase1-text); }
        .fase-2 .fase-titulo { background-color: var(--fase2-text); } .fase-2 .disciplina-card { border-left-color: var(--fase2-text); }
        .fase-3 .fase-titulo { background-color: var(--fase3-text); } .fase-3 .disciplina-card { border-left-color: var(--fase3-text); }
        .fase-4 .fase-titulo { background-color: var(--fase4-text); } .fase-4 .disciplina-card { border-left-color: var(--fase4-text); }
        .fase-5 .fase-titulo { background-color: var(--fase5-text); } .fase-5 .disciplina-card { border-left-color: var(--fase5-text); }
        .fase-6 .fase-titulo { background-color: var(--fase6-text); } .fase-6 .disciplina-card { border-left-color: var(--fase6-text); }
        .fase-7 .fase-titulo { background-color: var(--fase7-text); } .fase-7 .disciplina-card { border-left-color: var(--fase7-text); }
        .fase-8 .fase-titulo { background-color: var(--fase8-text); } .fase-8 .disciplina-card { border-left-color: var(--fase8-text); }
        .fase-9 .fase-titulo { background-color: var(--fase9-text); } .fase-9 .disciplina-card { border-left-color: var(--fase9-text); }
        .fase-10 .fase-titulo { background-color: var(--fase10-text); } .fase-10 .disciplina-card { border-left-color: var(--fase10-text); }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease-in-out;
        }
        .modal-overlay.visible { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--background-color); padding: 2rem; border-radius: 0.75rem;
            width: 90%; max-width: 500px; transform: scale(0.95); transition: all 0.3s ease-in-out;
        }
        .modal-overlay.visible .modal-content { transform: scale(1); }
        
        /* Scrollbar styles */
        .fluxograma-grid::-webkit-scrollbar { height: 8px; }
        .fluxograma-grid::-webkit-scrollbar-track { background: #e2e8f0; }
        .fluxograma-grid::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        .fluxograma-grid::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body>

    <div class="p-4 md:p-8">
        <header class="text-center mb-8 opacity-0 animate-fadeIn" style="animation-delay: 0s;">
            <h1 class="text-3xl md:text-4xl font-bold" style="color: var(--accent-color);">Engenharia de Petróleo</h1>
            <p class="text-lg mt-2 font-semibold" style="color: var(--text-muted-color);">FLUXOGRAMA DE DISCIPLINAS E REQUISITOS - 2025/2</p>
        </header>

        <div id="fluxograma" class="fluxograma-grid">
            <!-- Colunas e disciplinas serão inseridas aqui pelo JavaScript -->
        </div>
    </div>

    <!-- Modal Structure -->
    <div id="info-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-start">
                <h2 id="modal-title" class="text-2xl font-bold mb-4" style="color: var(--accent-color);"></h2>
                <button id="modal-close" class="text-2xl font-bold text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <h3 class="font-semibold text-lg">Pré-requisitos:</h3>
                    <p id="modal-prerequisitos" class="text-gray-600">Nenhum</p>
                </div>
                <div>
                    <h3 class="font-semibold text-lg">Matérias que dependem desta:</h3>
                    <p id="modal-dependencias" class="text-gray-600">Nenhuma</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const disciplinas = [
            {id:"calc1",nome:"Cálculo Diferencial e Integral I",fase:1,requisitos:[]},
            {id:"intro_eng",nome:"Introdução à Engenharia de Petróleo",fase:1,requisitos:[]},
            {id:"geo_analitica",nome:"Geometria Analítica",fase:1,requisitos:[]},
            {id:"quim_geral",nome:"Química Geral",fase:1,requisitos:[]},
            {id:"des_tecnico",nome:"Desenho Técnico",fase:1,requisitos:[]},
            {id:"quim_exp1",nome:"Química Experimental I",fase:1,requisitos:[]},
            {id:"ciencia_mat",nome:"Ciência dos Materiais",fase:1,requisitos:[]},
            {id:"fis_exp1",nome:"Física Experimental I",fase:1,requisitos:[]},
            {id:"calc2",nome:"Cálculo Diferencial e Integral II",fase:2,requisitos:["calc1"]},
            {id:"fisica1",nome:"Física I",fase:2,requisitos:["intro_eng"]},
            {id:"alg_linear",nome:"Álgebra Linear",fase:2,requisitos:["geo_analitica"]},
            {id:"quim_org1",nome:"Química Orgânica I",fase:2,requisitos:["quim_geral"]},
            {id:"est_desc",nome:"Estatística Descritiva",fase:2,requisitos:["des_tecnico"]},
            {id:"quim_exp2",nome:"Química Experimental II",fase:2,requisitos:["quim_exp1"]},
            {id:"fis_exp2",nome:"Física Experimental II",fase:2,requisitos:["fis_exp1"]},
            {id:"calc3",nome:"Cálculo Diferencial e Integral III",fase:3,requisitos:["calc2"]},
            {id:"fisica2",nome:"Física II",fase:3,requisitos:["fisica1"]},
            {id:"geo_geral",nome:"Geologia Geral",fase:3,requisitos:["alg_linear"]},
            {id:"quim_org2",nome:"Química Orgânica II",fase:3,requisitos:["quim_org1"]},
            {id:"ling_prog1",nome:"Linguagem de Programação I",fase:3,requisitos:["est_desc"]},
            {id:"estatica",nome:"Estática",fase:3,requisitos:["quim_exp2"]},
            {id:"fis_exp3",nome:"Física Experimental III",fase:3,requisitos:["fis_exp2"]},
            {id:"eq_dif",nome:"Equações Diferenciais",fase:4,requisitos:["calc3"]},
            {id:"fisica3",nome:"Física III",fase:4,requisitos:["fisica2"]},
            {id:"geo_petroleo",nome:"Geologia do Petróleo",fase:4,requisitos:["geo_geral"]},
            {id:"intro_fq",nome:"Introdução à Físico-Química",fase:4,requisitos:["quim_org2"]},
            {id:"met_num1",nome:"Métodos Numéricos I",fase:4,requisitos:["ling_prog1"]},
            {id:"res_mat",nome:"Resistência dos Materiais",fase:4,requisitos:["estatica"]},
            {id:"gestao_lid",nome:"Gestão e Liderança",fase:4,requisitos:[]},
            {id:"mec_fluidos",nome:"Mecânica dos Fluidos",fase:5,requisitos:["eq_dif"]},
            {id:"termo_aplic",nome:"Termodinâmica Aplicada ao Petróleo",fase:5,requisitos:["fisica3"]},
            {id:"geofisica",nome:"Geofísica",fase:5,requisitos:["geo_petroleo"]},
            {id:"instr_med",nome:"Instrumentação e Medidas",fase:5,requisitos:["intro_fq"]},
            {id:"met_num2",nome:"Métodos Numéricos II",fase:5,requisitos:["met_num1"]},
            {id:"geomecanica",nome:"Geomecânica",fase:5,requisitos:["res_mat"]},
            {id:"fund_energ",nome:"Fundamentos de Energias Renováveis",fase:5,requisitos:["gestao_lid"]},
            {id:"maq_fluxo",nome:"Máquinas de Fluxo",fase:6,requisitos:["mec_fluidos"]},
            {id:"transf_calor",nome:"Transferência de Calor",fase:6,requisitos:["termo_aplic"]},
            {id:"est_geol_campo",nome:"Estudo Geológico de Campo",fase:6,requisitos:["geofisica"]},
            {id:"eng_reserv1",nome:"Engenharia de Reservatórios I",fase:6,requisitos:["instr_med"]},
            {id:"escoa_multi",nome:"Escoamento Multifásico",fase:6,requisitos:["met_num2"]},
            {id:"eng_poco1",nome:"Engenharia de Poço I",fase:6,requisitos:["geomecanica"]},
            {id:"eng_submarina",nome:"Engenharia Submarina",fase:6,requisitos:["fund_energ"]},
            {id:"gestao_proj",nome:"Gestão de Projetos",fase:7,requisitos:["maq_fluxo"]},
            {id:"transf_massa",nome:"Transferência de Massa",fase:7,requisitos:["transf_calor"]},
            {id:"sist_contr",nome:"Sistemas de Controle e Automação",fase:7,requisitos:["est_geol_campo"]},
            {id:"eng_reserv2",nome:"Engenharia de Reservatórios II",fase:7,requisitos:["eng_reserv1"]},
            {id:"met_elev",nome:"Métodos de Elevação",fase:7,requisitos:["escoa_multi"]},
            {id:"eng_poco2",nome:"Engenharia de Poço II",fase:7,requisitos:["eng_poco1"]},
            {id:"proj_int1",nome:"Projeto Integrado I",fase:7,requisitos:["eng_submarina"]},
            {id:"econ_petroleo",nome:"Economia do Petróleo",fase:7,requisitos:[]},
            {id:"testes_pocos",nome:"Testes de Poços",fase:8,requisitos:["gestao_proj"]},
            {id:"proc_prim",nome:"Processamento Primário de Petróleo",fase:8,requisitos:["transf_massa"]},
            {id:"log_int",nome:"Logística Integrada",fase:8,requisitos:["sist_contr"]},
            {id:"sim_reserv",nome:"Simulação de Reservatórios",fase:8,requisitos:["eng_reserv2"]},
            {id:"garantia_escoa",nome:"Garantia de Escoamento",fase:8,requisitos:["met_elev"]},
            {id:"eng_poco3",nome:"Engenharia de Poço III",fase:8,requisitos:["eng_poco2"]},
            {id:"proj_int2",nome:"Projeto Integrado II",fase:8,requisitos:["proj_int1"]},
            {id:"imp_amb",nome:"Impactos Ambientais",fase:8,requisitos:["econ_petroleo"]},
            {id:"recup_avanc",nome:"Fundamentos de Recuperação Avançada",fase:9,requisitos:["testes_pocos"]},
            {id:"proc_oleo_gas",nome:"Processamento de Óleo e Gás",fase:9,requisitos:["proc_prim"]},
            {id:"saude_seg",nome:"Saúde e Segurança do Trabalho",fase:9,requisitos:["log_int"]},
            {id:"aval_proj",nome:"Avaliação de Projetos de Óleo e Gás",fase:9,requisitos:["sim_reserv"]},
            {id:"gerenc_riscos",nome:"Gerenciamento de Riscos Ambientais",fase:9,requisitos:["garantia_escoa"]},
            {id:"optativa1",nome:"OPTATIVA",fase:9,requisitos:[],optativa:true},
            {id:"proj_int3",nome:"Projeto Integrado III",fase:9,requisitos:["proj_int2"]},
            {id:"estagio",nome:"Estágio Supervisionado",fase:10,requisitos:["recup_avanc"]},
            {id:"tcc",nome:"Projeto de Conclusão de Curso",fase:10,requisitos:["proc_oleo_gas"]},
            {id:"optativa2",nome:"OPTATIVA",fase:10,requisitos:[],optativa:true},
            {id:"optativa3",nome:"OPTATIVA",fase:10,requisitos:[],optativa:true},
            {id:"optativa4",nome:"OPTATIVA",fase:10,requisitos:[],optativa:true},
            {id:"optativa5",nome:"OPTATIVA",fase:10,requisitos:[],optativa:true}
        ];

        const fluxogramaGrid = document.getElementById('fluxograma');
        const modal = document.getElementById('info-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalPrerequisitos = document.getElementById('modal-prerequisitos');
        const modalDependencias = document.getElementById('modal-dependencias');
        const modalClose = document.getElementById('modal-close');

        // 1. Criar colunas e disciplinas
        const numFases = 10;
        for (let i = 1; i <= numFases; i++) {
            const coluna = document.createElement('div');
            coluna.className = `fase-coluna fase-${i}`;
            coluna.id = `fase-${i}`;
            coluna.style.animationDelay = `${i * 100}ms`;
            const titulo = document.createElement('div');
            titulo.className = 'fase-titulo';
            titulo.textContent = `${i}ª Fase`;
            coluna.appendChild(titulo);
            fluxogramaGrid.appendChild(coluna);
        }

        let cardDelay = numFases * 100;
        disciplinas.forEach(d => {
            const coluna = document.getElementById(`fase-${d.fase}`);
            const card = document.createElement('div');
            card.className = 'disciplina-card';
            if (d.optativa) card.classList.add('optativa');
            card.textContent = d.nome;
            card.dataset.id = d.id;
            card.id = d.id;
            card.style.animationDelay = `${cardDelay + (d.fase * 50)}ms`;
            cardDelay += 20;
            coluna.appendChild(card);
        });

        // 2. Lógica do Modal
        function openModal(disciplinaId) {
            const disciplina = disciplinas.find(d => d.id === disciplinaId);
            if (!disciplina || disciplina.optativa) return;
            modalTitle.textContent = disciplina.nome;
            const prereqs = disciplina.requisitos.map(id => disciplinas.find(d => d.id === id)?.nome).filter(Boolean);
            modalPrerequisitos.textContent = prereqs.length > 0 ? prereqs.join(', ') : 'Nenhum';
            const deps = disciplinas.filter(d => d.requisitos.includes(disciplina.id)).map(d => d.nome);
            modalDependencias.textContent = deps.length > 0 ? deps.join(', ') : 'Nenhuma';
            modal.classList.add('visible');
        }
        function closeModal() {
            modal.classList.remove('visible');
        }

        // 3. Event Listeners
        fluxogramaGrid.addEventListener('click', (e) => {
            if (e.target.classList.contains('disciplina-card')) {
                openModal(e.target.dataset.id);
            }
        });
        modalClose.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });
        
    </script>
</body>
</html>
